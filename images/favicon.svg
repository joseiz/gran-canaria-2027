<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo azul (mar) -->
  <rect width="200" height="200" fill="#5eb3d6"/>
  
  <!-- Silueta más realista de Gran Canaria -->
  <!-- Basada en la forma característica con norte, sur, este y oeste -->
  <path d="M 100 20
           C 115 22, 128 28, 135 38
           C 142 48, 145 60, 148 75
           C 150 85, 152 95, 150 110
           C 148 125, 145 135, 138 145
           C 132 152, 120 160, 100 165
           C 80 160, 68 152, 62 145
           C 55 135, 52 125, 50 110
           C 48 95, 50 85, 52 75
           C 55 60, 58 48, 65 38
           C 72 28, 85 22, 100 20 Z" 
        fill="#d4a574" stroke="#8b7355" stroke-width="0.8"/>
  
  <!-- Detalles característicos: pequeñas bahías -->
  <!-- Bahía norte -->
  <ellipse cx="100" cy="35" rx="8" ry="6" fill="#5eb3d6" opacity="0.8"/>
  
  <!-- Bahía este -->
  <ellipse cx="145" cy="100" rx="5" ry="8" fill="#5eb3d6" opacity="0.8"/>
  
  <!-- Marca para Roque Nublo (pico más alto) -->
  <circle cx="95" cy="70" r="2" fill="#5a4a3a" opacity="0.7"/>
</svg>
